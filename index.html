<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geese</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="video-stage">
      <video
        class="background-video"
        src="loop.mp4"
        autoplay
        loop
        muted
        preload="auto"
        playsinline
        webkit-playsinline
        aria-hidden="true"
      ></video>

      <video
        class="geese-video"
        src="geese.mp4"
        autoplay
        loop
        muted
        preload="auto"
        playsinline
        webkit-playsinline
        aria-label="Geese"
      ></video>
    </main>
    <script src="script.js"></script>
  </body>
</html>
